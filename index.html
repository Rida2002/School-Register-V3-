<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">Student Management</p>
        <h1>School Register</h1>
        <p class="subtitle">A simple browser-based register for recording student attendance.</p>
      </div>
      <button id="clearAll" class="danger">Clear Register</button>
    </header>

    <section class="stats">
      <div class="stat"><span>Total Students</span><strong id="total">0</strong></div>
      <div class="stat"><span>Present</span><strong id="present">0</strong></div>
      <div class="stat"><span>Absent</span><strong id="absent">0</strong></div>
      <div class="stat"><span>Attendance</span><strong id="percentage">0%</strong></div>
    </section>

    <section class="card">
      <h2>Add Student</h2>
      <form id="studentForm">
        <input id="name" type="text" placeholder="Student name" required maxlength="60">
        <input id="className" type="text" placeholder="Class (e.g. 10A)" required maxlength="20">
        <select id="status">
          <option value="Present">Present</option>
          <option value="Absent">Absent</option>
        </select>
        <button type="submit">Add Student</button>
      </form>
    </section>

    <section class="card">
      <div class="table-header">
        <h2>Today's Register</h2>
        <input id="search" type="search" placeholder="Search students...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Class</th><th>Status</th><th>Action</th></tr>
          </thead>
          <tbody id="registerBody"></tbody>
        </table>
        <p id="empty" class="empty">No students added yet.</p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
